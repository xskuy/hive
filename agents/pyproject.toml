[project]
name = "hive-agents"
version = "0.1.0"
description = "Hive AI agents backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain>=0.3",
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "sse-starlette>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "langchain-openai>=1.1.12",
    "langchain-tavily>=0.2.17",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
