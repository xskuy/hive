[project]
name = "hive-backend"
version = "0.1.0"
description = "Transactional backend for Hive features backed by PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-openai>=1.1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
